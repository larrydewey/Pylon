# Pylon's DNSSEC validator for SSHFP against live DNS, compared with BIND's
# delv name by name (tests/dnssec_live.sh). The build sandbox has no DNS on
# port 53, so this is where the validator meets the real root.
name: dnssec-live

on:
  push:
    branches: [master]
    paths: ["core/dns*.resid", "core/resolver.resid", "cli/pylon.resid", "tests/dnssec_live.sh", ".github/workflows/dnssec-live.yml"]
  schedule:
    - cron: "41 5 * * 3"   # weekly: zones and keys change (a root KSK roll among them)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dnssec-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: pylon
      - uses: actions/checkout@v4
        with:
          repository: larrydewey/Resid
          path: resid

      - name: Toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lld bind9-dnsutils
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/usr/bin/env bash\nexec "%s/resid/build/boot/stage2.bin" "$@"\n' "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/bin/residc"
          chmod +x "$RUNNER_TEMP/bin/residc"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "RESID_HOME=$GITHUB_WORKSPACE/resid/build/boot" >> "$GITHUB_ENV"

      - name: Build pylon
        working-directory: pylon
        env:
          RESID_MEM_LIMIT: "8000"
        run: |
          ulimit -s unlimited
          umask 077; mkdir -p "$RUNNER_TEMP/keys"; residc keygen "$RUNNER_TEMP/keys" > /dev/null; umask 022
          export RESID_SIGNING_KEY="$RUNNER_TEMP/keys/resid-ed25519.key"
          mkdir -p build
          residc cli/pylon.resid -o build/pylon
          rm -rf "$RUNNER_TEMP/keys"

      - name: Live DNSSEC, two resolvers
        working-directory: pylon
        run: |
          bash tests/dnssec_live.sh build/pylon 1.1.1.1
          bash tests/dnssec_live.sh build/pylon 9.9.9.9
