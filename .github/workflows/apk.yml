# Builds the Android app: the Resid core (libpylon.so, libpylon_term.so,
# libpylon_local.so and the pylond builds the app installs on servers, tools/android-core.sh),
# then the APK. Pushes to master and pull requests keep the APK as a
# short-lived workflow artifact; a published release gets it attached.
#
# Signing (repository secrets; without them the APK is debug-signed and
# says so in its name):
#   ANDROID_KEYSTORE_BASE64    the signing keystore, base64. It must be the
#                              key earlier releases were signed with, or
#                              Obtainium cannot update an installed app.
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   RESID_SIGNING_KEY          the Resid provenance key (hex seed); without
#                              it each run signs the core with a fresh key
# Repository variable (optional; the source carries the default):
#   SYMBOLON_CERT_SHA256       Symbolon's release certificate(s), the only
#                              agent service the app binds (SPEC 7.3)
#
# Cleaning up: secrets are written to the runner's temporary directory and
# removed when the job ends, whatever happened; build outputs stay on the
# discarded runner; artifacts expire after 14 days, and each run deletes
# the APK artifacts of earlier runs on the same branch.
name: apk

on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      pylond_release:
        description: "A release tag whose signed pylond to reproduce and pack (the APK is not attached to it)"
        required: false
        default: ""

permissions:
  contents: write   # attach the APK to a release
  actions: write    # delete earlier runs' artifacts

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          path: pylon
      - name: Release toolchain
        # Reproducing a signed pylond release needs the Resid compiler it was
        # built with (tools/release/toolchain.env), not Resid's master; clang
        # and lld come from tools/release/toolchain (build-pylond.sh).
        id: pin
        env:
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.pylond_release }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ]; then
            . pylon/tools/release/toolchain.env
            echo "resid_ref=$RESID_COMMIT" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        with:
          repository: larrydewey/Resid
          path: resid
          ref: ${{ steps.pin.outputs.resid_ref }}

      - name: Toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lld
          # The compiler's memory budget is generous; swap keeps a peak from
          # killing the runner.
          sudo fallocate -l 8G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          b=$(find "$ANDROID_NDK_LATEST_HOME" -name 'libclang_rt.builtins-aarch64-android.a' | head -1)
          test -n "$b"
          echo "RESID_AARCH64_BUILTINS=$b" >> "$GITHUB_ENV"
          echo "RESID_HOME=$GITHUB_WORKSPACE/resid/build/boot" >> "$GITHUB_ENV"
          # Resid commits the compiler (stage2.bin), not the residc wrapper.
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/usr/bin/env bash\nexec "%s/resid/build/boot/stage2.bin" "$@"\n' "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/bin/residc"
          chmod +x "$RUNNER_TEMP/bin/residc"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Signing material
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RESID_KEY: ${{ secrets.RESID_SIGNING_KEY }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/keys"
          if [ -n "$RESID_KEY" ]; then
            printf '%s\n' "$RESID_KEY" > "$RUNNER_TEMP/keys/resid-ed25519.key"
          else
            residc keygen "$RUNNER_TEMP/keys" > /dev/null
          fi
          echo "RESID_SIGNING_KEY=$RUNNER_TEMP/keys/resid-ed25519.key" >> "$GITHUB_ENV"
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/keys/release.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/keys/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=release" >> "$GITHUB_ENV"
          else
            echo "SIGNED=debug" >> "$GITHUB_ENV"
          fi

      - name: Signed pylond release (SPEC 8.2)
        # The maintainers attach the release made with tools/release
        # (pylond-x86_64, pylond-aarch64, pylond.release, pylond.proof) to
        # the GitHub release; android-core.sh packs it once this build
        # reproduces its code images. Without it the APK carries unsigned
        # pylond builds, which its pylon refuses to push. A manual run with
        # pylond_release checks that a release reproduces, without
        # attaching anything.
        if: steps.pin.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pin.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          d="$RUNNER_TEMP/pylond-release"
          mkdir -p "$d"
          if gh release download "$TAG" -R "$REPO" -D "$d" -p 'pylond-x86_64' -p 'pylond-aarch64' -p 'pylond.release' -p 'pylond.proof' \
             && [ -f "$d/pylond.release" ] && [ -f "$d/pylond.proof" ]; then
            echo "PYLOND_RELEASE_DIR=$d" >> "$GITHUB_ENV"
          else
            echo "no signed pylond release attached to $TAG: the APK carries unsigned pylond builds"
          fi

      - name: Core for Android
        working-directory: pylon
        env:
          RESID_MEM_LIMIT: "12000"
        run: |
          ulimit -s unlimited
          bash tools/android-core.sh

      - name: Keep a pylond build that did not reproduce
        # The rebuilt pylond (and its LLVM IR), to compare with the release's.
        if: failure() && env.PYLOND_RELEASE_DIR != ''
        uses: actions/upload-artifact@v7
        with:
          name: pylond-reproduced-${{ github.run_id }}
          path: pylon/build/android/pylond-reproduced/
          retention-days: 7
          if-no-files-found: ignore

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable

      - name: Test and build the APK
        working-directory: pylon/app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter analyze
          flutter test
          # arm64 only: the core is built for it (tools/android-core.sh).
          flutter build apk --release --target-platform android-arm64 -PsymbolonCerts="${{ vars.SYMBOLON_CERT_SHA256 }}"
          # The release asset is pylon-vX.Y.Z.apk, the name Obtainium follows.
          name="pylon-${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}"
          [ "$SIGNED" = release ] || name="$name-debug-signed"
          mkdir -p "$RUNNER_TEMP/out"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/out/$name.apk"
          (cd "$RUNNER_TEMP/out" && sha256sum "$name.apk" > "$name.apk.sha256")
          echo "APK_NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: pylon-apk-${{ github.run_id }}
          path: ${{ runner.temp }}/out/
          retention-days: 14
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          # Only a release-signed APK goes out: Obtainium updates an installed
          # app only from an APK signed with the same key.
          [ "$SIGNED" = release ] || { echo "no release keystore in the secrets: not attaching a debug-signed APK"; exit 1; }
          cd "$RUNNER_TEMP/out"
          gh release upload "$TAG" "$APK_NAME.apk" --clobber -R "$REPO"
          # SHA256SUMS lists every asset: its APK line is replaced, the rest kept.
          gh release download "$TAG" -p SHA256SUMS -R "$REPO" 2>/dev/null || touch SHA256SUMS
          grep -v " $APK_NAME.apk\$" SHA256SUMS > sums.new || true
          sha256sum "$APK_NAME.apk" >> sums.new
          sort -k2 sums.new > SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber -R "$REPO"

      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

  prune:
    # Earlier runs' APK artifacts on the same branch are superseded.
    needs: apk
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - name: Delete superseded artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN: ${{ github.run_id }}
        run: |
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name | startswith(\"pylon-apk-\")) | select(.workflow_run.head_branch == \"$BRANCH\") | select(.workflow_run.id != $RUN) | .id" |
          while read -r id; do gh api -X DELETE "repos/$REPO/actions/artifacts/$id"; done
