name: pylon
description: "Pylon: a security-first terminal (SSH and the Pylon protocol)."
publish_to: 'none'
version: 0.1.10+10

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # pylond builds pushed to servers (tools/android-core.sh)
    - assets/pylond/
  fonts:
    # JetBrains Mono 2.304 (SIL Open Font License 1.1, assets/fonts/JetBrainsMono-OFL.txt)
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-Italic.ttf
          style: italic
